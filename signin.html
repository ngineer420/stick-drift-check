<!-- The sign-in mail links here rather than at auth.sch3ma.com, so the link a person sees
     is stickdriftcheck.com. This page runs twice per sign-in:
       #sch3ma_link=…   the token from the mail. The SDK hands it back to auth.sch3ma.com.
       #sch3ma_code=…   auth.sch3ma.com sends the browser back with a one-time code. The
                        SDK completes the sign-in, and the page returns the visitor to
                        where they asked for the link.
     Both ride the URL fragment, which a browser never sends to a server. -->
<script type="module">
  import { client } from "/assets/js/sch3ma.js";

  const HOME = "/stick-drift-test/";

  function say(head, text) {
    document.getElementById("head").textContent = head;
    const note = document.getElementById("note");
    note.textContent = text + " ";
    const back = document.createElement("a");
    back.href = HOME;
    back.textContent = "Go to the stick drift test";
    note.append(back);
  }

  const db = await client();
  if (!db) {
    say("Sign-in is not available", "This site cannot sign you in right now.");
  } else if (db.handleSignInLink()) {
    // The browser is already on its way to auth.sch3ma.com, which sends it back here.
  } else if (location.hash.includes("sch3ma_code=")) {
    let session = null;
    try {
      session = await db.completeSignIn();
    } catch {
      say("That link did not work", "A link works once and expires. Ask for a new one from the drift history.");
    }
    if (session) {
      // A history this browser saved before signing in joins the one on the email.
      if (session.orphan && session.orphan.mergeable) {
        try { await session.merge(session.orphan.identity); } catch { /* the sign-in itself stands */ }
      }
      location.replace(db.signInReturnPath() || HOME);
    }
  } else {
    say("Nothing to sign in with", "This page finishes a sign-in link. Open the link from your email.");
  }
</script>
